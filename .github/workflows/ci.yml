name: C/C++ CI

on:
  push:
    branches: [ "main", "debugger-start" ]
  pull_request:
    branches: [ "main", "debugger-start" ]

jobs:
  #GCC on Ubuntu 22.04
  linux_ubuntu_22_04:
    name: (Ubuntu 24.04) GCC ${{ matrix.gcc-version }}.x, ${{ matrix.portal.name }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        portal: [ {flag: OFF, dep: libgtk-3-dev, name: GTK}, {flag: ON, dep: libdbus-1-dev, name: Portal} ] # The NFD_PORTAL setting defaults to OFF (i.e. uses GTK)
        autoappend: [ {flag: OFF, name: NoAppendExtn} ] # By default the NFD_PORTAL mode does not append extensions, because it breaks some features of the portal
        gcc-version: [11, 12, 13]
    steps:
    - uses: actions/checkout@v4

    - name: Install GCC ${{ matrix.gcc-version }}
      run: |
        sudo apt-get install -y gcc-${{ matrix.gcc-version }} g++-${{ matrix.gcc-version }}  ${{ matrix.portal.dep }}

    - name: Select GCC ${{ matrix.gcc-version }}
      run: |
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-${{ matrix.gcc-version }} 100
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-${{ matrix.gcc-version }} 100

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y libsdl2-dev cmake ninja-build ${{ matrix.portal.dep }}

    - name: Build quaesar
      env:
        CC: gcc-${{ matrix.gcc-version }}
        CXX: g++-${{ matrix.gcc-version }}
      run: mkdir temp && cd temp && cmake .. -G Ninja -DNFD_PORTAL=${{ matrix.portal.flag }} && ninja --verbose 


  linux_clang:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} Clang ${{ matrix.clang-version }}.x, ${{ matrix.portal.name }}
    strategy:
      fail-fast: false
      matrix:
        portal: [ {flag: OFF, dep: libgtk-3-dev, name: GTK}, {flag: ON, dep: libdbus-1-dev, name: Portal} ] # The NFD_PORTAL setting defaults to OFF (i.e. uses GTK)
        autoappend: [ {flag: OFF, name: NoAppendExtn} ] # By default the NFD_PORTAL mode does not append extensions, because it breaks some features of the portal
        include:
          - os: ubuntu-22.04
            portal: {flag: OFF, dep: libgtk-3-dev, name: GTK}
            clang-version: 12
          - os: ubuntu-22.04
            portal: {flag: ON, dep: libdbus-1-dev, name: Portal}
            clang-version: 13
          - os: ubuntu-22.04
            clang-version: 14
          - os: ubuntu-22.04
            clang-version: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Clang ${{ matrix.clang-version }}
      run: |
        sudo apt-get install -y clang-${{ matrix.clang-version }} clang++-${{ matrix.clang-version }}

    - name: Select Clang ${{ matrix.clang-version }}
      run: |
        sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-${{ matrix.clang-version }} 100
        sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-${{ matrix.clang-version }} 100

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y libsdl2-dev cmake ninja-build ${{ matrix.portal.dep }}

    - name: Build quaesar
      env:
        CC: clang-${{ matrix.clang-version }}
        CXX: clang++-${{ matrix.clang-version }}
      run: mkdir temp && cd temp && cmake .. -G Ninja -DNFD_PORTAL=${{ matrix.portal.flag }} && ninja --verbose

  macos:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-14]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Uninstall existing cmake (if any)
      run: brew uninstall cmake || true

    - name: Install dependencies
      run: brew install sdl2 cmake ninja

    - name: Build quaesar 
      run: mkdir temp && cd temp && cmake .. -G Ninja && ninja 

  windows:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-2022, windows-2025]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild path
      uses: microsoft/setup-msbuild@v2
        
    - name: Build Solution (Debug, x64)
      run: mkdir temp && cd temp && ..\bin\windows\bin\cmake .. && msbuild quaesar.sln /p:Configuration=Debug /p:Platform="x64"


